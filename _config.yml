# Site settings. Theme: AcademicPages (a fork of Minimal Mistakes), taken from
# tommccoy1.github.io under the MIT license; see THEME-LICENSE.txt.

locale                   : "en-US"
title                    : "Hongao Zhu"
title_separator          : "-"
name                     : &name "Hongao Zhu"
description              : &description "PhD student in computational linguistics at UC San Diego, working on language models, language acquisition, and psycholinguistics."
url                      : "https://hongao0611.github.io"
baseurl                  : ""
repository               : "Hongao0611/Hongao0611.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
read_more                : "disabled"

comments:
  provider               : false
atom_feed:
  path                   : # blank (default) uses feed.xml
twitter:
  username               :
og_image                 :
analytics:
  provider               : false

# Sidebar. No email here, so the address stays obfuscated (see the Contact page).
author:
  name             : "Hongao Zhu"
  avatar           : "/assets/images/mypic.jpg"
  bio              : "PhD student in computational linguistics at UC San Diego"
  googlescholar    : "https://scholar.google.com/citations?user=FHqFfM8AAAAJ&hl=en"
  github           : "Hongao0611"

# Reading files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Gemfile
  - Gemfile.lock
  - vendor
  - LICENSE
  - THEME-LICENSE.txt
  - README
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Front matter defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting: no timezone (UTC, as before), so post URLs keep their old /YYYY/MM/DD/ dates

plugins:
  - jekyll-feed
